<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MacroTrack</title>

    <link rel="stylesheet" href="./css/style.css">

    <link rel="manifest" href="./manifest.json">

    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

    <meta name="theme-color" content="#0f172a">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <meta name="apple-mobile-web-app-title" content="MacroTrack">

</head>

<body>

    <!-- ==========================
         INSTALL APP
    ========================== -->

    <section
        id="installSection"
        class="install-section"
        hidden>

        <div class="install-content">

            <div>

                <h2>Install MacroTrack</h2>

                <p>
                    Add MacroTrack to this device for faster access and offline use.
                </p>

            </div>

            <button
                type="button"
                id="installAppButton"
                class="install-button">

                Install App

            </button>

        </div>

        <p
            id="installMessage"
            class="install-message"
            aria-live="polite"></p>

    </section>

    <div class="app">

        <!-- HEADER -->

        <header>

            <h1>🍽 MacroTrack</h1>

            <p id="todayDate">
                Loading date...
            </p>

        </header>

        <!-- DAILY TOTALS -->

        <section class="card">

            <h2>Today's Progress</h2>

            <div class="macro">

                <div class="label">

                    <span>Calories</span>

                    <span id="caloriesText">
                        0 / 2400
                    </span>

                </div>

                <div class="progress">

                    <div
                        id="caloriesBar"
                        class="fill calories"></div>

                </div>

            </div>

            <div class="macro">

                <div class="label">

                    <span>Protein</span>

                    <span id="proteinText">
                        0 / 180g
                    </span>

                </div>

                <div class="progress">

                    <div
                        id="proteinBar"
                        class="fill protein"></div>

                </div>

            </div>

            <div class="macro">

                <div class="label">

                    <span>Carbs</span>

                    <span id="carbsText">
                        0 / 220g
                    </span>

                </div>

                <div class="progress">

                    <div
                        id="carbsBar"
                        class="fill carbs"></div>

                </div>

            </div>

            <div class="macro">

                <div class="label">

                    <span>Fat</span>

                    <span id="fatText">
                        0 / 70g
                    </span>

                </div>

                <div class="progress">

                    <div
                        id="fatBar"
                        class="fill fat"></div>

                </div>

            </div>

        </section>

        <!-- TODAY'S FOOD -->

        <section class="card">

            <h2>Today's Food</h2>

            <div id="foodLog">

                <p class="empty">

                    No food logged today.

                </p>

            </div>

        </section>

    </div>

    <!-- BOTTOM NAVIGATION -->

    <nav>

        <button id="dashboardButton">

            <div class="icon">🏠</div>

            <div>Dashboard</div>

        </button>

        <button id="libraryButton">

            <div class="icon">📚</div>

            <div>Library</div>

        </button>

        <button id="historyButton">

            <div class="icon">📈</div>

            <div>History</div>

        </button>

        <button id="settingsButton">

            <div class="icon">⚙</div>

            <div>Settings</div>

        </button>

    </nav>

    <script src="./js/storage.js"></script>
    <script src="./js/dashboard.js"></script>
    <script src="./js/app.js"></script>

</body>

</html>
